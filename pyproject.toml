[project]
name = "glowstar-pricing"
version = "0.1.0"
description = "Glow Star Diamond Pricing & Inventory Intelligence System"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["glowstar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
