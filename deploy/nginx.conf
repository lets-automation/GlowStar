# TLS terminator in front of the API. certbot fills in the certificate lines.
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # The CRM prices whole books at a time; a 5,000-stone batch is a big body
    # and a slow response. These limits exist so a legitimate bulk call is not
    # cut off mid-flight.
    client_max_body_size 32m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health is open (a load balancer must be able to probe it) but not public
    # internet — restrict to Glow Star's IP ranges in production.
    location /health { proxy_pass http://127.0.0.1:8000/health; access_log off; }
}
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;   # never serve prices in the clear
}
